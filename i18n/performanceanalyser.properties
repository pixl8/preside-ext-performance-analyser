settings.form.fieldset.logging.title=Enable logging
settings.form.fieldset.display.title=Page display options
settings.form.fieldset.storage.title=Storage duration
settings.form.fieldset.storage.description=Configure the duration for which Lucee debug logs are stored in the Preside database. Consider that a lot of logs can be generated, especially in live sites!
settings.form.fieldset.includerules.title=Only store when...
settings.form.fieldset.includerules.description=Configure optional rules to only store logs in the Preside database for certain requests.
settings.form.fieldset.excluderules.title=Never store when...
settings.form.fieldset.excluderules.description=Configure optional rules to never store logs in the Preside database for certain requests.

settings.form.field.debug.title=Enable logging
settings.form.field.maxlogs.help=Lucee stores debug logs in memory. Configure the maximum number of logs to store to ensure memory is not consumed.
settings.form.field.features.title=Log features
settings.form.field.trackallocation.title=Track memory allocation
settings.form.field.trackallocation.help=When logging is enabled, record bytes allocated by each view, viewlet, layout and event. This is allocation on the request thread, not memory still held afterwards.
settings.form.field.showlogs.title=Display debug output in pages
settings.form.field.showlogs.help=When off, metrics are still collected into the Preside database (silent Empty template). Turn on to also render Lucee debug output in the page for matching IPs.
settings.form.field.ipaddresses.title=Restrict to IP Addresses
settings.form.field.ipaddresses.help=Only used when displaying debug output in pages. Leave blank (or use *) to show for all IPs. Behind Docker/proxies the save-time client IP is often wrong for your browser.

settings.form.field.storageduration.title=Duration (days)
settings.form.field.includetasks.title=Included tasks
settings.form.field.includetasks.help=When ticked, we will log adhoc and task manager task "requests"
settings.form.field.onlyforips.title=Only for IPs
settings.form.field.onlyforips.placeholder=One IP address per line. Leave empty for all ips.
settings.form.field.onlyforurls.title=Only for URLs
settings.form.field.onlyforurls.placeholder=One URL regex pattern per line. Leave empty for all URLs.
settings.form.field.excludetasks.title=Exclude background tasks
settings.form.field.excludeurls.title=Never for URLs
settings.form.field.excludeurls.placeholder=One URL regex pattern per line. Leave empty for no exclude rules.

